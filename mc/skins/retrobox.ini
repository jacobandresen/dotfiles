# Retrobox (Neovim's built-in gruvbox-flavoured scheme) for Midnight
# Commander, matching Turbo Vim with `colorscheme retrobox`: warm cream text
# on near-black panels, the Turbo Vision chrome (grey menus and dialogs,
# red hotkeys, green selection) in gruvbox tones.
#
# Needs a truecolor terminal (COLORTERM=truecolor) and MC built with S-Lang.

[skin]
    description = Retrobox
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Bg = #1c1c1c
    Bg1 = #3c3836
    Bg2 = #504945
    Bg3 = #665c54
    Gray = #a89984
    Gray2 = #928374
    Fg = #ebdbb2
    Fg0 = #fbf1c7
    Red = #fb5944
    DarkRed = #9d0006
    RedBg = #cc241d
    Green = #b8bb26
    Olive = #98971a
    Yellow = #fabd2f
    Blue = #83a598
    BlueBg = #2a405a
    Purple = #d3869b
    Aqua = #8ec07c
    Orange = #fe8019

[core]
    # panels: cream on near-black, grey frames, yellow headers
    _default_ = Fg;Bg
    selected = Bg;Blue
    marked = Yellow;Bg;bold
    markselect = Yellow;Blue;bold
    gauge = Fg0;Olive
    input = Fg;Bg1
    inputunchanged = Gray2;Bg1
    inputmark = Fg;BlueBg
    disabled = Bg3;Gray
    reverse = Bg;Gray
    commandlinemark = Fg;BlueBg
    header = Yellow;Bg;bold
    inputhistory = Bg;Olive
    commandhistory = Bg;Olive
    shadow = Bg2;#000000

[dialog]
    _default_ = Bg;Gray
    dfocus = Bg;Olive
    dhotnormal = DarkRed;Gray
    dhotfocus = Fg0;Olive
    dtitle = Fg0;Gray;bold

[error]
    _default_ = Fg0;RedBg
    errdfocus = Bg;Olive
    errdhotnormal = Yellow;RedBg
    errdhotfocus = Fg0;Olive
    errdtitle = Yellow;RedBg;bold

[filehighlight]
    directory = Green;
    executable = Aqua;
    symlink = Blue;
    hardlink =
    stalelink = Red;
    device = Purple;
    special = Purple;
    core = Red;
    temp = Gray2;
    archive = Orange;
    doc = Gray;
    source = Yellow;
    media = Purple;
    graph = Aqua;
    database = Orange;

[menu]
    _default_ = Bg;Gray
    menusel = Bg;Olive
    menuhot = DarkRed;Gray
    menuhotsel = Fg0;Olive
    menuinactive = Bg;Gray

[popupmenu]
    _default_ = Bg;Gray
    menusel = Bg;Olive
    menutitle = Fg0;Gray;bold

[buttonbar]
    hotkey = DarkRed;Gray
    button = Bg;Gray

[statusbar]
    _default_ = Bg;Gray

[help]
    _default_ = Fg;Bg1
    helpitalic = Blue;Bg1
    helpbold = Yellow;Bg1;bold
    helplink = Aqua;Bg1;underline
    helpslink = Bg;Olive
    helptitle = Green;Bg1;bold

[editor]
    _default_ = Fg;Bg
    editbold = Yellow;Bg;bold
    editmarked = Fg;BlueBg
    editwhitespace = Bg2;Bg
    editnonprintable = ;#000000
    editlinestate = Bg3;Bg
    bookmark = Fg0;RedBg
    bookmarkfound = Bg;Olive
    editrightmargin = Bg2;Bg
    editbg = ;Bg
    editframe = Gray2;
    editframeactive = Fg;
    editframedrag = Green;

[viewer]
    _default_ = Fg;Bg
    viewbold = Yellow;Bg;bold
    viewunderline = Aqua;Bg;underline
    viewselected = Fg;BlueBg

[diffviewer]
    added = Fg0;#3d4220
    changedline = Fg;#2a405a
    changednew = Fg0;#5b3a52
    changed = Fg;#2a405a
    removed = Fg0;#6b2320
    error = Fg0;RedBg

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◄
    history-next-item-char = ►
    history-show-list-char = ↓
    filename-scroll-left-char = ◄
    filename-scroll-right-char = ►

[widget-scrollbar]
    first-vert-char = ▲
    last-vert-char = ▼
    first-horiz-char = ◄
    last-horiz-char = ►
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ■
