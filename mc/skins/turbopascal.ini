# Turbo Pascal 7.0 / Turbo Vision look for Midnight Commander, matching
# Turbo Vim's colors/turbopascal.lua: EGA palette, yellow on blue windows
# with white double frames, grey menus and dialogs with red hotkeys and a
# green selection bar, red-key hint line at the bottom.
#
# Needs a truecolor terminal (COLORTERM=truecolor) and MC built with S-Lang.

[skin]
    description = Turbo Pascal 7.0
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Black = #000000
    Blue = #0000AA
    Green = #00AA00
    Cyan = #00AAAA
    Red = #AA0000
    Magenta = #AA00AA
    Brown = #AA5500
    LightGray = #AAAAAA
    DarkGray = #555555
    LightBlue = #5555FF
    LightGreen = #55FF55
    LightCyan = #55FFFF
    LightRed = #FF5555
    LightMagenta = #FF55FF
    Yellow = #FFFF55
    White = #FFFFFF

[core]
    # panels are edit windows: yellow on blue, white frame
    _default_ = Yellow;Blue
    selected = Black;Cyan
    marked = White;Blue;bold
    markselect = White;Cyan;bold
    gauge = White;Green
    input = White;Blue
    inputunchanged = LightGray;Blue
    inputmark = Blue;Cyan
    disabled = DarkGray;LightGray
    reverse = Black;LightGray
    commandlinemark = Blue;Cyan
    header = White;Blue;bold
    inputhistory = Black;Green
    commandhistory = Black;Green
    shadow = DarkGray;Black

[dialog]
    _default_ = Black;LightGray
    dfocus = White;Green
    dhotnormal = Red;LightGray
    dhotfocus = Yellow;Green
    dtitle = White;LightGray;bold

[error]
    _default_ = White;Red
    errdfocus = White;Green
    errdhotnormal = Yellow;Red
    errdhotfocus = Yellow;Green
    errdtitle = White;Red;bold

[filehighlight]
    directory = White;
    executable = LightGreen;
    symlink = LightCyan;
    hardlink =
    stalelink = LightRed;
    device = LightMagenta;
    special = LightMagenta;
    core = LightRed;
    temp = LightGray;
    archive = LightMagenta;
    doc = LightGray;
    source = LightCyan;
    media = LightGreen;
    graph = LightCyan;
    database = LightRed;

[menu]
    _default_ = Black;LightGray
    menusel = Black;Green
    menuhot = Red;LightGray
    menuhotsel = Red;Green
    menuinactive = Black;LightGray

[popupmenu]
    _default_ = Black;LightGray
    menusel = Black;Green
    menutitle = White;LightGray;bold

[buttonbar]
    hotkey = Red;LightGray
    button = Black;LightGray

[statusbar]
    _default_ = Black;LightGray

[help]
    # TP's help windows: black on cyan, yellow cross-references
    _default_ = Black;Cyan
    helpitalic = Blue;Cyan
    helpbold = White;Cyan;bold
    helplink = Yellow;Cyan
    helpslink = Black;Green
    helptitle = White;Cyan;bold

[editor]
    _default_ = Yellow;Blue
    editbold = White;Blue;bold
    editmarked = Blue;Cyan
    editwhitespace = LightBlue;Blue
    editnonprintable = ;Black
    editlinestate = Cyan;Blue
    bookmark = White;Red
    bookmarkfound = Black;Green
    editrightmargin = LightBlue;Blue
    editbg = ;Blue
    editframe = LightGray;
    editframeactive = White;
    editframedrag = LightGreen;

[viewer]
    _default_ = Yellow;Blue
    viewbold = White;Blue;bold
    viewunderline = LightCyan;Blue;underline
    viewselected = Blue;Cyan

[diffviewer]
    added = White;Green
    changedline = Black;Cyan
    changednew = White;Magenta
    changed = Black;Cyan
    removed = White;Red
    error = White;Red

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◄
    history-next-item-char = ►
    history-show-list-char = ↓
    filename-scroll-left-char = ◄
    filename-scroll-right-char = ►

[widget-scrollbar]
    first-vert-char = ▲
    last-vert-char = ▼
    first-horiz-char = ◄
    last-horiz-char = ►
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ■
