# kitty as an MS-DOS era text screen (VGA 80x25, light grey on black), to
# match Turbo Vim (nvim/colors/turbopascal.lua) and the turbopascal mc skin.

# VGA text-mode font. Nerd Font icons (nvim, lazygit) come from Terminess.
font_family      More Perfect DOS VGA
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures always
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Terminess Nerd Font Mono

# 80x25, like the VGA text mode
initial_window_width  80c
initial_window_height 25c
remember_window_size  no
window_padding_width  4

# blinking underscore cursor, as DOS drew it
cursor_shape               underline
cursor_underline_thickness 3.0
cursor_blink_interval      0.5
cursor_stop_blinking_after 0

# the 16-colour EGA/VGA palette; colour 3 is DOS brown, not dark yellow
foreground            #AAAAAA
background            #000000
cursor                #AAAAAA
cursor_text_color     #000000
selection_foreground  #000000
selection_background  #AAAAAA
url_color             #55FFFF

color0  #000000
color1  #AA0000
color2  #00AA00
color3  #AA5500
color4  #0000AA
color5  #AA00AA
color6  #00AAAA
color7  #AAAAAA
color8  #555555
color9  #FF5555
color10 #55FF55
color11 #FFFF55
color12 #5555FF
color13 #FF55FF
color14 #55FFFF
color15 #FFFFFF

# plain text-mode tab bar: grey bar, active tab in reverse
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " │ "
tab_title_template     "{index}:{title}"
active_tab_foreground   #000000
active_tab_background   #AAAAAA
active_tab_font_style   normal
inactive_tab_foreground #AAAAAA
inactive_tab_background #000000
inactive_tab_font_style normal
tab_bar_background      #000000

# no transparency, no fading: CRTs didn't have them
background_opacity 1.0
inactive_text_alpha 1.0
