# kitty with a 120x40 layout and the Retrobox palette shared with Neovim and MC.

# Hack Nerd Font: crisp, highly readable, with Nerd Font glyphs for Neovim, lazygit.
# Ligatures are disabled so code reads literally.
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures always
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Hack Nerd Font Mono
shell_integration enabled

# roomier default while keeping cell-based sizing
initial_window_width  120c
initial_window_height 40c
remember_window_size  no
window_padding_width  4
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
map ctrl+shift+h show_scrollback

# Keep terminal selection, Neovim yanks, and paste on the system clipboard.
copy_on_select clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# block cursor
cursor_shape block

# plain text-mode tab bar; the theme supplies active/inactive colors
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " │ "
tab_title_template     "{index}:{title}"
active_tab_font_style   normal
inactive_tab_font_style normal

# opaque background
background_opacity 1.0
inactive_text_alpha 1.0

include current-theme.conf
