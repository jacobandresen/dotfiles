# Context stays at 8192 here, unlike the macOS profiles (which run
# 16384). The Vulkan iGPU path has no KV cache quantization, so a 16K
# window costs twice what it does on Metal and does not fit under the
# MemoryHigh cap below. Raise both together on a box with real VRAM.
[Service]
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_VULKAN=true"
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KEEP_ALIVE=10m"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
MemoryHigh=10G
