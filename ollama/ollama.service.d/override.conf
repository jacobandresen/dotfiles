[Unit]
Wants=ollama-warm-model.service

[Service]
Environment="OLLAMA_CONTEXT_LENGTH=32768"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=-1"
# Two models stay resident: mellum (pi tasks) and fim (Neovim autocomplete).
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_NUM_PARALLEL=3"
# Keep the 8.5 GB Mellum model resident in RAM: it only half-fits in 6 GB VRAM,
# and every swapped-out expert page costs seconds per token on CPU decode.
MemoryHigh=13G
MemorySwapMax=1G
